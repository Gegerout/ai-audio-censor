[project]
name = "ai-audio-censor"
version = "0.1.0"
description = "Система автоматического поиска и запикивания нецензурной лексики в аудио"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]
ml = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "mlflow==3.17.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.3",
    "scikit-learn==1.9.1",
]
tracking = [
    "mlflow==3.17.1",
    "psycopg2-binary==2.9.13",
]
web = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "faststream[rabbit]>=0.7.7",
    "httpx>=0.28.1",
    "mlflow==3.17.1",
    "pandas>=3.0.6",
    "pydantic-settings>=2.15.0",
    "scikit-learn==1.9.1",
    "uvicorn[standard]>=0.53.0",
]

[tool.uv]
default-groups = ["dev", "web"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=src --cov=ml.data --cov=ml.model --cov=ml.evaluation --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
# Точка входа консольной команды выполняется только при запуске процесса, а не в тестах
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # ошибки стиля pycodestyle
    "W",     # предупреждения стиля pycodestyle
    "F",     # pyflakes, неиспользуемые импорты и переменные
    "I",     # сортировка импортов isort
    "UP",    # pyupgrade, современный синтаксис Python 3.11
    "N",     # имена по PEP 8
    "RUF",   # собственные правила ruff
    "BLE",   # запрет except Exception без уважительной причины
    "ANN",   # обязательные аннотации типов
    "ASYNC", # блокирующие вызовы внутри async def
    "B",     # типичные баги, изменяемые аргументы по умолчанию, raise без from
]
ignore = [
    "RUF001", # ложные срабатывания на кириллицу в строках
    "RUF002", # ложные срабатывания на кириллицу в docstring
    "RUF003", # ложные срабатывания на кириллицу в комментариях
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]  # аннотации в тестах не несут контракта

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"

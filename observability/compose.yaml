x-observer: &observer
  pull_policy: build
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "2"

services:
  loki:
    <<: *observer
    profiles: [logs, observability]
    image: ${COMPOSE_PROJECT_NAME}-loki:${LOKI_VERSION:-3.6.3}
    build:
      context: .
      args:
        BASE_IMAGE: grafana/loki:${LOKI_VERSION:-3.6.3}
    command: [-config.file=/etc/loki/config.yaml]
    mem_limit: 256m
    environment:
      GOMEMLIMIT: 192MiB
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    healthcheck:
      test: [CMD, /bin/busybox, wget, -qO, /dev/null, 'http://127.0.0.1:3100/ready']
      interval: 5s
      timeout: 3s
      retries: 18

  alloy:
    <<: *observer
    profiles: [logs, observability]
    image: ${COMPOSE_PROJECT_NAME}-alloy:${ALLOY_VERSION:-v1.11.2}
    build:
      context: .
      args:
        BASE_IMAGE: grafana/alloy:${ALLOY_VERSION:-v1.11.2}
    command: [run, --disable-reporting, --storage.path=/var/lib/alloy, /etc/alloy/config.alloy]
    mem_limit: 144m
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      GOMEMLIMIT: 96MiB
    ports:
      - "127.0.0.1:${SOURCE_SYSLOG_PORT:-15140}:15140/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./log-agent/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    healthcheck:
      test: [CMD, /bin/busybox, wget, -qO, /dev/null, 'http://127.0.0.1:12345/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    <<: *observer
    profiles: [traces, observability]
    image: ${COMPOSE_PROJECT_NAME}-otel-collector:${OTEL_COLLECTOR_VERSION:-0.140.0}
    build:
      context: .
      args:
        BASE_IMAGE: otel/opentelemetry-collector:${OTEL_COLLECTOR_VERSION:-0.140.0}
    command: [--config=/etc/otelcol/config.yaml]
    mem_limit: 96m
    environment:
      GOMEMLIMIT: 68MiB
    networks: [backend, default]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: [CMD, /bin/busybox, wget, -qO, /dev/null, 'http://127.0.0.1:13133/']
      interval: 5s
      timeout: 3s
      retries: 12

  tempo:
    <<: *observer
    profiles: [traces, observability]
    image: ${COMPOSE_PROJECT_NAME}-tempo:${TEMPO_VERSION:-2.9.0}
    build:
      context: .
      args:
        BASE_IMAGE: grafana/tempo:${TEMPO_VERSION:-2.9.0}
    command: [-config.file=/etc/tempo.yaml]
    mem_limit: 240m
    environment:
      GOMEMLIMIT: 180MiB
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    healthcheck:
      test: [CMD, /bin/busybox, wget, -qO, /dev/null, 'http://127.0.0.1:3200/ready']
      interval: 5s
      timeout: 3s
      retries: 18

networks:
  backend:

volumes:
  tempo-data:
  loki-data:
  alloy-data:
